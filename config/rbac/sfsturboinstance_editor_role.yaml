# This rule is not used by the project huawei-sfs-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sfs.huaweicloud.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: huawei-sfs-operator
    app.kubernetes.io/managed-by: kustomize
  name: sfsturboinstance-editor-role
rules:
- apiGroups:
  - sfs.huaweicloud.com
  resources:
  - sfsturboinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sfs.huaweicloud.com
  resources:
  - sfsturboinstances/status
  verbs:
  - get
