# This rule is not used by the project huawei-sfs-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over sfs.huaweicloud.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: huawei-sfs-operator
    app.kubernetes.io/managed-by: kustomize
  name: sfsturboinstance-admin-role
rules:
- apiGroups:
  - sfs.huaweicloud.com
  resources:
  - sfsturboinstances
  verbs:
  - '*'
- apiGroups:
  - sfs.huaweicloud.com
  resources:
  - sfsturboinstances/status
  verbs:
  - get
