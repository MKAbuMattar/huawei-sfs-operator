apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sfs-operator
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sfs-operator
subjects:
  - kind: ServiceAccount
    name: sfs-operator
    namespace: {{ .Values.namespace }}
